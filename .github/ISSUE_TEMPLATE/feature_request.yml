name: Feature request
description: Предложить сервис, обход или улучшение интерфейса
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Раздел
      options:
        - Service catalog
        - Обходы
        - Smart routing
        - Test Lab
        - Web UI
        - Devices / policies
        - Sources
        - Diagnostics
        - DNS
        - Installer / updates
        - Other
  - type: textarea
    id: problem
    attributes:
      label: Какую проблему нужно решить
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Как это должно работать для обычного пользователя
    validations:
      required: true
