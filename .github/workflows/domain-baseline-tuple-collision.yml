name: DNS baseline tuple collision diagnostic
on:
  workflow_dispatch:
  push:
    branches: ['work/domain-baseline-tuple-collision-20261116']
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.5'
          cache: false
      - name: Install disposable namespace tools
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y iproute2 iptables util-linux
      - name: Original compiler predicates against concurrent direct flow
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          { git rev-parse HEAD; go version; uname -srvm; lscpu; } > artifacts/platform.txt
          sudo env PATH="$PATH" GOTOOLCHAIN=local \
            GOMODCACHE="$(go env GOMODCACHE)" GOCACHE="$(go env GOCACHE)" \
            sh scripts/test-domain-baseline-tuple-collision-native.sh 2>&1 | tee artifacts/collision.log
          grep -F -- '--- PASS: TestDomainBaselineTupleCollisionNative ' artifacts/collision.log
          if grep -F -- '--- SKIP:' artifacts/collision.log; then exit 1; fi
      - name: Preserve counterexample or refusal evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: domain-tuple-collision-${{ github.sha }}
          path: artifacts/
