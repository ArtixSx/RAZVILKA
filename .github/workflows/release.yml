name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Run checks and cross-build
        run: ./scripts/check.sh

      - name: Package Entware bundle
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          STAGE="RAZVILKA-${VERSION}"
          mkdir -p "$STAGE"
          cp -a README.md LAB.md LICENSE THIRD_PARTY.md configs dist scripts "$STAGE"/
          tar -czf "RAZVILKA-${VERSION}-entware.tar.gz" "$STAGE"
          zip -qr "RAZVILKA-${VERSION}-entware.zip" "$STAGE"
          sha256sum "RAZVILKA-${VERSION}-entware.tar.gz" "RAZVILKA-${VERSION}-entware.zip" > "RAZVILKA-${VERSION}.SHA256SUMS"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --title "RAZVILKA $GITHUB_REF_NAME" \
            --generate-notes \
            dist/razvilka-linux-amd64 \
            dist/razvilka-linux-arm64 \
            dist/razvilka-linux-mips \
            dist/razvilka-linux-mipsle \
            dist/SHA256SUMS \
            "RAZVILKA-${VERSION}-entware.tar.gz" \
            "RAZVILKA-${VERSION}-entware.zip" \
            "RAZVILKA-${VERSION}.SHA256SUMS"
