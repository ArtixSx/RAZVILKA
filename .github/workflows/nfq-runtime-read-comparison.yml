name: Matched NFQ runtime read comparison
on:
  workflow_dispatch:
  push:
    branches: ['work/nfq-runtime-read-comparison-20261117']
permissions:
  contents: read
concurrency:
  group: nfq-runtime-read-comparison-${{ github.ref }}
  cancel-in-progress: false
jobs:
  comparison:
    name: Same runner ABBA / ${{ matrix.mode }}
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        mode: [production, race]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.5'
          cache: false
      - name: Source parity and censored-result contracts
        run: python3 scripts/test-nfq-runtime-read-comparison.py
      - name: Install isolated native dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y iptables nftables iproute2 util-linux iputils-ping wireguard-tools python3 curl ca-certificates libnetfilter-queue1 libnfnetlink0 libluajit-5.1-2 zlib1g libmnl0
      - name: Retain exact reviewed legacy tool closure
        shell: bash
        run: |
          set -euo pipefail
          packages=$(sudo mktemp -d /tmp/razvilka-read-packages.XXXXXX)
          case "$packages" in /tmp/razvilka-read-packages.??????) ;; *) exit 1 ;; esac
          trap 'sudo rm -rf -- "$packages"' EXIT
          sudo python3 scripts/check-classic-save-pinned-fixture.py --download-dir "$packages"
          sudo apt-get install --reinstall --allow-downgrades --no-install-recommends -y \
            "$packages/iptables.deb" "$packages/libip4tc2.deb" \
            "$packages/libip6tc2.deb" "$packages/libxtables12.deb"
          sudo python3 scripts/check-classic-save-pinned-fixture.py
      - name: Original runtime frame custody and complete byte contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nfq-read-contracts"
          flags=()
          if [ '${{ matrix.mode }}' = race ]; then flags=(-race); fi
          sudo env PATH="$PATH" GOTOOLCHAIN=local \
            GOMODCACHE="$(go env GOMODCACHE)" GOCACHE="$(go env GOCACHE)" \
            go test "${flags[@]}" -tags razvilka_native_fixture -count=1 -v \
            ./internal/components ./internal/strategylab \
            -run '^TestManagedRuntimeReadFrame|^TestSelectedCandidateRuntimeObservationCannotReplaceOriginalLease$' \
            2>&1 | tee "$RUNNER_TEMP/nfq-read-contracts/contracts.log"
          for name in TestManagedRuntimeReadFrameCustodyAndRevocation TestManagedRuntimeReadFrameRefusesChangedGraphAndOwner TestManagedRuntimeReadFrameJoinsBeforeClosingDescriptors TestManagedRuntimeReadFrameOriginalStreamsAndAbnormalExit TestSelectedCandidateRuntimeObservationCannotReplaceOriginalLease; do
            grep -F -- "--- PASS: $name " "$RUNNER_TEMP/nfq-read-contracts/contracts.log"
          done
          if grep -F -- '--- SKIP:' "$RUNNER_TEMP/nfq-read-contracts/contracts.log"; then exit 1; fi
      - name: Same-source original consumer ABBA with original 14-second deadline
        shell: bash
        run: |
          set -euo pipefail
          sudo env PATH="$PATH" GOTOOLCHAIN=local \
            GOMODCACHE="$(go env GOMODCACHE)" GOCACHE="$(go env GOCACHE)" \
            RAZVILKA_NFQ_RUNTIME_READ_OUTPUT="$RUNNER_TEMP/nfq-runtime-read-comparison" \
            bash scripts/compare-nfq-runtime-read.sh '${{ matrix.mode }}'
      - name: Hand bounded public evidence back to the runner even after failure
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          sudo python3 - "$RUNNER_TEMP" "$(id -u)" "$(id -g)" <<'PY'
          import os,pathlib,stat,sys
          parent=pathlib.Path(sys.argv[1]); out=parent/'nfq-runtime-read-comparison'
          if not parent.is_absolute() or parent!=parent.resolve():raise SystemExit('canonical runner temp required')
          if not out.exists():raise SystemExit(0)
          if out.is_symlink() or out!=out.resolve() or not out.is_dir():raise SystemExit('foreign evidence root')
          entries=[out,*out.rglob('*')]
          if len(entries)>128:raise SystemExit('evidence entry bound')
          total=0
          for p in entries:
              s=p.lstat()
              if not (stat.S_ISDIR(s.st_mode) or stat.S_ISREG(s.st_mode)):raise SystemExit('foreign evidence entry')
              if stat.S_ISREG(s.st_mode):
                  if s.st_nlink!=1:raise SystemExit('linked evidence file')
                  total+=s.st_size
          if total>64<<20:raise SystemExit('evidence byte bound')
          uid,gid=int(sys.argv[2]),int(sys.argv[3])
          if uid<=0 or gid<=0:raise SystemExit('nonroot runner identity required')
          for p in entries:os.chown(p,uid,gid,follow_symlinks=False)
          PY
      - name: Verify exact complete population and candidate service acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/nfq-runtime-read-comparison/comparison.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1])); rows=d['samples']
          assert len(rows)==4 and [r['side'] for r in rows]==['baseline','candidate','candidate','baseline']
          assert d['comparison_valid'] and d['all_candidate_samples_pass'] and d['source_trees_unchanged_after_population']
          print('EXACT_NFQ_RUNTIME_READ_ABBA_COMPLETE: candidate service+cleanup PASS; baseline failures remain censored')
          PY
      - name: Preserve exact source, raw failures and comparison evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nfq-runtime-read-${{ matrix.mode }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/nfq-read-contracts/
            ${{ runner.temp }}/nfq-runtime-read-comparison/
