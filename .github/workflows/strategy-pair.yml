name: Strategy pair focused validation
on:
  push:
    branches: ['work/bypass-integration-20261031', 'work/bypass-validation-20261031']
    paths:
      - 'internal/strategylab/**'
      - 'internal/privatebackup/**'
      - 'internal/privaterestore/**'
      - 'internal/updatecheck/**'
      - 'internal/dataplane/**'
      - 'internal/components/**'
      - 'internal/restorejournal/**'
      - 'internal/ownedfs/**'
      - 'internal/app/**'
      - 'internal/operationgate/**'
      - 'internal/startuptools/**'
      - 'internal/nativecheckfixture/**'
      - 'scripts/test-managed-probe-native.sh'
      - 'scripts/native-managed-probe-queue-init.py'
      - 'scripts/test-domain-original-native.sh'
      - 'scripts/check-node-native-performance.sh'
      - 'cmd/razvilka/**'
      - '.github/workflows/strategy-pair.yml'
permissions:
  contents: read
jobs:
  node-native-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.5'
          cache: false
      - name: Pinned official Xray and isolated fixture tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y iproute2 util-linux unzip
          curl --fail --location --retry 3 -o /tmp/xray.zip https://github.com/XTLS/Xray-core/releases/download/v26.3.27/Xray-linux-64.zip
          echo '23cd9af937744d97776ee35ecad4972cf4b2109d1e0fe6be9930467608f7c8ae  /tmp/xray.zip' | sha256sum --check --strict
          unzip /tmp/xray.zip xray -d /tmp/xray-extracted
          sudo install -d -m 0755 /usr/local/lib/razvilka-fixtures
          sudo install -m 0555 /tmp/xray-extracted/xray /usr/local/lib/razvilka-fixtures/xray
      - name: Actual full Check and App queue measurements
        shell: bash
        run: |
          sudo env PATH="$PATH" GOMODCACHE="$(go env GOMODCACHE)" GOCACHE="$(go env GOCACHE)" \
            RAZVILKA_XRAY_NATIVE=/usr/local/lib/razvilka-fixtures/xray \
            RAZVILKA_NODE_PERF_OUTPUT="$GITHUB_WORKSPACE/artifacts/node-native-performance" \
            sh scripts/check-node-native-performance.sh
      - name: Preserve measured samples and environment
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: node-native-performance-${{ github.sha }}
          path: artifacts/node-native-performance
          if-no-files-found: error
  managed-probe-native:
    name: managed-probe-native (${{ matrix.build-mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        build-mode: [production, race]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.5'
          cache: false
      - name: Disposable native NFQUEUE fixture dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y iptables nftables iproute2 util-linux python3 curl ca-certificates libnetfilter-queue1 libnfnetlink0 libluajit-5.1-2 zlib1g libmnl0
      - name: Version batch metadata and invocation refusal regressions
        shell: bash
        run: |
          sudo env PATH="$PATH" GOTOOLCHAIN=local GOMODCACHE="$(go env GOMODCACHE)" GOCACHE="$(go env GOCACHE)" \
            go test -count=1 ./internal/startuptools ./internal/dataplane -run '^TestStaticVersion|^TestVersionReadBatch|^TestVersionBatch|^TestClassicReadBatch|^TestBackendInventoryBatch' -v
      - name: Actual native phase diagnostics and complete LAN workflow
        shell: bash
        run: |
          set -euo pipefail
          native_status=0
          sudo env PATH="$PATH" GOMODCACHE="$(go env GOMODCACHE)" GOCACHE="$(go env GOCACHE)" RAZVILKA_MANAGED_PROBE_BUILD_MODE="${{ matrix.build-mode }}" sh scripts/test-managed-probe-native.sh || native_status=$?
          lan_status=0
          sudo env PATH="$PATH" GOMODCACHE="$(go env GOMODCACHE)" GOCACHE="$(go env GOCACHE)" RAZVILKA_MANAGED_PROBE_BUILD_MODE="${{ matrix.build-mode }}" sh scripts/test-managed-probe-lan-native.sh || lan_status=$?
          echo "Actual diagnostic statuses native=$native_status lan=$lan_status (no performance comparison)"
          test "$native_status" = 0 && test "$lan_status" = 0
  strategy-pair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.5'
          cache: false
      - name: Install native fixture
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y busybox-static iproute2 util-linux
      - name: Actual reader binary compatibility
        shell: bash
        run: |
          set -euo pipefail
          go build -o /tmp/razvilka-current ./cmd/razvilka
          test "$(/tmp/razvilka-current -strategy-lab-read-version)" = 7
          test "$(/tmp/razvilka-current -component-update-schema)" = 6
          test "$(/tmp/razvilka-current -dataplane-execution-read-version)" = 4
          test "$(/tmp/razvilka-current -self-update-private-snapshot-read-version)" = 4
          git worktree add --detach /tmp/razvilka-old 577ebe54eb53499a9fbe46aef93d39bee82a0192
          (cd /tmp/razvilka-old && go build -o /tmp/razvilka-old-binary ./cmd/razvilka)
          if /tmp/razvilka-old-binary -strategy-lab-read-version >/tmp/old-reader.txt 2>&1; then exit 1; fi
          if /tmp/razvilka-old-binary -self-update-private-snapshot-read-version >/tmp/old-snapshot.txt 2>&1; then exit 1; fi
          git worktree add --detach /tmp/razvilka-reader5 c982d09fcd73c1a85c2bcdf1716f7b7d7bb3b8be
          (cd /tmp/razvilka-reader5 && go build -o /tmp/razvilka-reader5-binary ./cmd/razvilka)
          test "$(/tmp/razvilka-reader5-binary -strategy-lab-read-version)" = 5
      - name: Focused native and race checks
        shell: bash
        run: |
          sudo env PATH="$PATH" GOTOOLCHAIN=local \
            RAZVILKA_STRATEGY_PAIR_BINARY=/tmp/razvilka-current RAZVILKA_STRATEGY_PAIR_OLD_BINARY=/tmp/razvilka-old-binary \
            RAZVILKA_STRATEGY_PAIR_V5_BINARY=/tmp/razvilka-reader5-binary \
            GOMODCACHE="$(go env GOMODCACHE)" GOCACHE="$(go env GOCACHE)" \
            sh -c 'umask 022; go test -race -count=1 ./internal/strategylab ./internal/privatebackup ./internal/privaterestore && go test -race -count=1 ./internal/updatecheck ./cmd/razvilka ./internal/app ./internal/dataplane ./internal/operationgate -run "TestStrategyPair|TestStrategyRollbackRetention|TestNativeCandidateStoppedCompletionTwoCuts|TestStrategyState|TestLateStrategyState|TestPrivateStrategy|TestPairedOfflineRestoreStreams|TestPrivateRecoveryMaintenance|TestExecutionHistory|TestExecutionReader|TestRetainedExecutionReader|TestManagedStrategyProbe|TestManagedSelection|TestControlEpochReadObservation"'
      - name: Restored panel boot in isolated network namespace
        shell: bash
        run: |
          sudo env PATH="$PATH" GOTOOLCHAIN=local RAZVILKA_PRIVATE_PANEL_NATIVE=1 \
            GOMODCACHE="$(go env GOMODCACHE)" GOCACHE="$(go env GOCACHE)" \
            go test -count=1 ./cmd/razvilka -run '^TestPrivateStrategyRestoredPanelBoot$' -v
  scoped-native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.5'
          cache: false
      - name: Pinned official Xray and disposable namespace tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y iproute2 iptables util-linux unzip busybox-static python3
          curl --fail --location --retry 3 -o /tmp/xray.zip https://github.com/XTLS/Xray-core/releases/download/v26.10.31/Xray-linux-64.zip
          echo 'e4bd9119f50ae7c41658b1abd0679ae06f98bd864a2907ff33f2f2cf7081b214  /tmp/xray.zip' | sha256sum --check --strict
          unzip /tmp/xray.zip xray -d /tmp/xray-extracted
          sudo install -d -m 0755 /usr/local/lib/razvilka-fixtures
          sudo install -m 0555 /tmp/xray-extracted/xray /usr/local/lib/razvilka-fixtures/xray
          /usr/local/lib/razvilka-fixtures/xray version
          # The real local CA fixture uses the compiler's reviewed 26.3.27.
          # 26.10.31 defaults to a bundled CA pool instead of system roots.
          curl --fail --location --retry 3 -o /tmp/xray-node.zip https://github.com/XTLS/Xray-core/releases/download/v26.3.27/Xray-linux-64.zip
          echo '23cd9af937744d97776ee35ecad4972cf4b2109d1e0fe6be9930467608f7c8ae  /tmp/xray-node.zip' | sha256sum --check --strict
          unzip /tmp/xray-node.zip xray -d /tmp/xray-node-fixture
          sudo install -d -m 0755 /usr/local/lib/razvilka-fixtures/xray-node26.3.27
          sudo install -m 0555 /tmp/xray-node-fixture/xray /usr/local/lib/razvilka-fixtures/xray-node26.3.27/xray
          curl --fail --location --retry 3 -o /tmp/hev-socks5-tunnel https://github.com/heiher/hev-socks5-tunnel/releases/download/2.17.1/hev-socks5-tunnel-linux-x86_64
          echo 'a98763f18b0ad1f72a903221008488275f2bf60be00028886f9fa41622df6a03  /tmp/hev-socks5-tunnel' | sha256sum --check --strict
          sudo install -m 0555 /tmp/hev-socks5-tunnel /usr/local/lib/razvilka-fixtures/hev-socks5-tunnel
          curl --fail --location --retry 3 -o /tmp/mihomo.gz https://github.com/MetaCubeX/mihomo/releases/download/v1.19.33/mihomo-linux-amd64-v1.19.33.gz
          echo '132f6f3edf9a65e62f04853aed3358472e0b2b7666daa8419edfa2ddf5bb6323  /tmp/mihomo.gz' | sha256sum --check --strict
          sudo install -m 0400 /tmp/mihomo.gz /usr/local/lib/razvilka-fixtures/mihomo.gz
      - name: Original DNS source, Xray descriptors and cancellation
        shell: bash
        run: |
          sudo env PATH="$PATH" GOTOOLCHAIN=local \
            RAZVILKA_DOMAIN_TCP_FACTORY_NATIVE=1 RAZVILKA_XRAY_NATIVE=/usr/local/lib/razvilka-fixtures/xray \
            GOMODCACHE="$(go env GOMODCACHE)" GOCACHE="$(go env GOCACHE)" \
            go test -race -count=1 ./internal/dataplane -run 'TestDomainTCPOriginalFactoryProcessCancellation|TestDomainTCPFactoryOriginalDNSReserve|TestDomainTCPBaseline|TestXrayDomainTCPNativeHeldProcessLifecycle|TestXraySelectedTCPNativeHeldJSONConfig|TestNFQWSProbe' -v
      - name: Original LAN DNS capture selected TLS and transparent baseline
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          sudo env PATH="$PATH" GOTOOLCHAIN=local \
            RAZVILKA_XRAY_NATIVE=/usr/local/lib/razvilka-fixtures/xray-node26.3.27/xray \
            GOMODCACHE="$(go env GOMODCACHE)" GOCACHE="$(go env GOCACHE)" \
            sh scripts/test-domain-original-native.sh
      - name: Actual HEV TUN HTTPS and owned cleanup in private namespaces
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          sudo env PATH="$PATH" GOTOOLCHAIN=local \
            RAZVILKA_HEV_NATIVE=/usr/local/lib/razvilka-fixtures/hev-socks5-tunnel \
            GOMODCACHE="$(go env GOMODCACHE)" GOCACHE="$(go env GOCACHE)" \
            go test -race -count=1 ./internal/dataplane -run '^TestHEVOwnedNativeTUNLifecycle$' -v
      - name: HEV binary and receipt crash recovery with official pinned asset
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          sudo env PATH="$PATH" GOTOOLCHAIN=local \
            RAZVILKA_HEV_NATIVE=/usr/local/lib/razvilka-fixtures/hev-socks5-tunnel \
            GOMODCACHE="$(go env GOMODCACHE)" GOCACHE="$(go env GOCACHE)" \
            go test -race -count=1 ./internal/components ./internal/restorejournal ./internal/app ./cmd/razvilka -run '^TestHEV|^TestProxySidecar|^TestRecoveryIdentity' -v
      - name: Mihomo large artifact transaction and process crash recovery
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          sudo env PATH="$PATH" GOTOOLCHAIN=local \
            RAZVILKA_MIHOMO_ARCHIVE=/usr/local/lib/razvilka-fixtures/mihomo.gz \
            GOMODCACHE="$(go env GOMODCACHE)" GOCACHE="$(go env GOCACHE)" \
            go test -race -count=1 ./internal/ownedfs ./internal/restorejournal ./internal/components ./internal/dataplane -run '^TestAtomicStream|^TestArtifact|^TestMihomo' -v
