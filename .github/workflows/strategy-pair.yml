name: WireGuard native validation
on:
  push:
    branches: ['work/wg-native-validation-20261101']
permissions:
  contents: read
jobs:
  wireguard-native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.5'
          cache: false
      - name: Actual kernel and CLI fixture dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y wireguard-tools iproute2 iptables util-linux
      - name: Isolated WG candidate, endpoint and network lifecycle
        shell: bash
        run: |
          sudo env PATH="$PATH" GOTOOLCHAIN=local \
            GOMODCACHE="$(go env GOMODCACHE)" GOCACHE="$(go env GOCACHE)" \
            sh scripts/test-wireguard-native.sh
  managed-probe-native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.5'
          cache: false
      - name: Disposable native NFQUEUE fixture dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y iptables nftables iproute2 util-linux python3 curl ca-certificates libnetfilter-queue1 libnfnetlink0 libluajit-5.1-2 zlib1g libmnl0
      - name: Actual managed source, TLS flow, exact NFQUEUE counters and cleanup
        shell: bash
        run: |
          sudo env PATH="$PATH" GOMODCACHE="$(go env GOMODCACHE)" GOCACHE="$(go env GOCACHE)" sh scripts/test-managed-probe-native.sh
