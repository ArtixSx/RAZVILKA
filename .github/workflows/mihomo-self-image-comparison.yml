name: Same-host original cold self-image route comparison
run-name: Cold self-image ABBA normal and race / ${{ github.sha }}
on:
  workflow_dispatch:
  push:
    branches: ['work/mihomo-self-image-*']
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-26.04
    # Eight unchanged original executions plus builds; each consumer retains
    # its original 120s deadline and private harness backstops.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.5'
          cache: false
      - name: Pinned official Xray and disposable namespace tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y iproute2 iptables nftables ipset conntrack kmod curl openssl util-linux unzip busybox-static python3 libnetfilter-queue1 libnfnetlink0 libluajit-5.1-2 zlib1g libmnl0
          # Match approved code bytes; apt's amd64v3 variant is not the
          # reviewed static-version source and keeps costly real child reads.
          sameboot_packages=$(sudo mktemp -d /tmp/razvilka-sameboot-packages.XXXXXX)
          case "$sameboot_packages" in /tmp/razvilka-sameboot-packages.??????) ;; *) exit 1 ;; esac
          trap 'sudo rm -rf -- "$sameboot_packages"' EXIT
          sudo python3 scripts/check-classic-save-pinned-fixture.py --download-dir "$sameboot_packages"
          sudo apt-get install --reinstall --allow-downgrades --no-install-recommends -y \
            "$sameboot_packages/iptables.deb" "$sameboot_packages/libip4tc2.deb" \
            "$sameboot_packages/libip6tc2.deb" "$sameboot_packages/libxtables12.deb"
          sudo python3 scripts/check-classic-save-pinned-fixture.py
          curl --fail --location --retry 3 -o /tmp/xray.zip https://github.com/XTLS/Xray-core/releases/download/v26.10.31/Xray-linux-64.zip
          echo 'e4bd9119f50ae7c41658b1abd0679ae06f98bd864a2907ff33f2f2cf7081b214  /tmp/xray.zip' | sha256sum --check --strict
          unzip /tmp/xray.zip xray -d /tmp/xray-extracted
          sudo install -d -m 0755 /usr/local/lib/razvilka-fixtures
          sudo install -m 0555 /tmp/xray-extracted/xray /usr/local/lib/razvilka-fixtures/xray
          /usr/local/lib/razvilka-fixtures/xray version
          # The real local CA fixture uses the compiler's reviewed 26.3.27.
          # 26.10.31 defaults to a bundled CA pool instead of system roots.
          curl --fail --location --retry 3 -o /tmp/xray-node.zip https://github.com/XTLS/Xray-core/releases/download/v26.3.27/Xray-linux-64.zip
          echo '23cd9af937744d97776ee35ecad4972cf4b2109d1e0fe6be9930467608f7c8ae  /tmp/xray-node.zip' | sha256sum --check --strict
          unzip /tmp/xray-node.zip xray -d /tmp/xray-node-fixture
          sudo install -d -m 0755 /usr/local/lib/razvilka-fixtures/xray-node26.3.27
          sudo install -m 0555 /tmp/xray-node-fixture/xray /usr/local/lib/razvilka-fixtures/xray-node26.3.27/xray
          curl --fail --location --retry 3 -o /tmp/hev-socks5-tunnel https://github.com/heiher/hev-socks5-tunnel/releases/download/2.17.1/hev-socks5-tunnel-linux-x86_64
          echo 'a98763f18b0ad1f72a903221008488275f2bf60be00028886f9fa41622df6a03  /tmp/hev-socks5-tunnel' | sha256sum --check --strict
          sudo install -m 0555 /tmp/hev-socks5-tunnel /usr/local/lib/razvilka-fixtures/hev-socks5-tunnel
          sudo install -m 0555 /tmp/hev-socks5-tunnel /usr/local/lib/razvilka-fixtures/hev-official
          curl --fail --location --retry 3 -o /tmp/mihomo.gz https://github.com/MetaCubeX/mihomo/releases/download/v1.19.33/mihomo-linux-amd64-v1.19.33.gz
          echo '132f6f3edf9a65e62f04853aed3358472e0b2b7666daa8419edfa2ddf5bb6323  /tmp/mihomo.gz' | sha256sum --check --strict
          sudo install -m 0400 /tmp/mihomo.gz /usr/local/lib/razvilka-fixtures/mihomo.gz
      - name: Prepare the separately pinned HEV source lab
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install --no-install-recommends -y make patch
          mkdir -p artifacts
          python3 - <<'PYCODE'
          import json,pathlib,struct
          data=pathlib.Path('/proc/self/auxv').read_bytes()
          assert 0 < len(data) <= 4096 and len(data)%16 == 0
          minimum=next(value for key,value in struct.iter_unpack('<QQ',data) if key==51)
          assert 0 < minimum <= 1<<20
          pathlib.Path('artifacts/hev-lab-platform.json').write_text(json.dumps({'at_minsigstksz_bytes':minimum,'official_fixed_stack_bytes':8192,'official_libc_minimum_bytes':max(minimum,1024)+1024,'source_lab':True})+'\n')
          PYCODE
          sh scripts/build-hev-runtime-altstack-lab.sh "$GITHUB_WORKSPACE/artifacts/hev-lab" 2>&1 | tee artifacts/hev-lab-build.txt
          echo '1170182f821cec62b03c1443747e52b45f48baa7d7595f45e95c2ccf958972d9  artifacts/hev-lab/bin/hev-patched' | sha256sum --check --strict
          sudo install -m 0555 artifacts/hev-lab/bin/hev-patched /usr/local/lib/razvilka-fixtures/hev-socks5-tunnel
          go test -count=1 -v ./internal/components -run '^TestHEVDefaultReleasePins$' | tee artifacts/hev-default-pin-tests.txt
          grep -F -- '--- PASS: TestHEVDefaultReleasePins ' artifacts/hev-default-pin-tests.txt
          if grep -F -- '--- SKIP:' artifacts/hev-default-pin-tests.txt; then exit 1; fi
          sudo env PATH="$PATH" GOTOOLCHAIN=local \
            GOMODCACHE="$(go env GOMODCACHE)" GOCACHE="$(go env GOCACHE)" \
            RAZVILKA_HEV_NATIVE=/usr/local/lib/razvilka-fixtures/hev-socks5-tunnel \
            go test -count=1 -v -tags razvilka_native_fixture,razvilka_hev_altstack_lab \
            ./internal/components -run '^TestHEV(AltstackLabExactPin|ReleasePinnedDownloadRejectsBeforeExecution|ReleasePinnedNativeInstall)$' \
            | tee artifacts/hev-lab-pin-tests.txt
          if grep -F -- '--- SKIP:' artifacts/hev-lab-pin-tests.txt; then exit 1; fi
          for name in TestHEVAltstackLabExactPin TestHEVReleasePinnedDownloadRejectsBeforeExecution TestHEVReleasePinnedNativeInstall; do
            grep -F -- "--- PASS: $name " artifacts/hev-lab-pin-tests.txt
          done
      - name: Fixed eight-sample original parent comparison
        shell: bash
        run: |
          set -euo pipefail
          { git rev-parse HEAD; go version; uname -srvm; lscpu; } > artifacts/environment.txt
          sudo modprobe tun
          sudo env PATH="$PATH" GOTOOLCHAIN=local \
            GOMODCACHE="$(go env GOMODCACHE)" GOCACHE="$(go env GOCACHE)" \
            RAZVILKA_XRAY_NATIVE=/usr/local/lib/razvilka-fixtures/xray-node26.3.27/xray \
            RAZVILKA_MIHOMO_ARCHIVE=/usr/local/lib/razvilka-fixtures/mihomo.gz \
            RAZVILKA_HEV_NATIVE=/usr/local/lib/razvilka-fixtures/hev-socks5-tunnel \
            sh scripts/compare-mihomo-same-boot-self-image.sh "$PWD/artifacts/comparison"
      - name: Preserve all outcomes and exact source delta
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sameboot-self-image-comparison-${{ github.sha }}
          path: |
            artifacts/environment.txt
            artifacts/comparison
            artifacts/hev-default-pin-tests.txt
            artifacts/hev-lab-platform.json
            artifacts/hev-lab-pin-tests.txt
            artifacts/hev-lab-build.txt
            artifacts/hev-lab/build-manifest.json
            artifacts/hev-lab/fault-tests.txt
          if-no-files-found: error
