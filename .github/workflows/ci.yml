name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # The full gate runs Go tests twice (normal and race), about 100 UI tests,
    # four cross-builds and the Entware transaction. On the Linux test VM the
    # updatecheck/app race and app normal runs alone took over 20 minutes.
    timeout-minutes: 60
    env:
      GOTOOLCHAIN: local
      # Intermediate router work uses AArch64; release/default checks keep all targets.
      RAZVILKA_BUILD_TARGETS: ${{ (github.ref == 'refs/heads/review/unified-lan-20260923' || github.head_ref == 'review/unified-lan-20260923') && 'arm64' || 'all' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          cache: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install native parser fixture
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y busybox-static

      - name: Original unpublished intent with actual denied write
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          go test -count=1 ./internal/dataplane -run '^TestNFQWSUnpublished' -v | tee /tmp/nfq-unpublished-intent.log
          if grep -F -- '--- SKIP:' /tmp/nfq-unpublished-intent.log; then exit 1; fi

      - name: Focused ownership and recovery regressions
        shell: bash
        run: |
          sudo env PATH="$PATH" GOTOOLCHAIN=local \
            GOMODCACHE="$(go env GOMODCACHE)" GOCACHE="$(go env GOCACHE)" \
            go test -count=1 ./internal/dataplane ./internal/netidentity ./internal/app ./internal/probecheck ./internal/startuptools ./internal/updatecheck ./cmd/nodeeval ./cmd/razvilka \
              -run '^TestNFQLANRPDB|^TestNFQWSActiveRPDB|^TestBootstrapQuiesceJoin|^TestBootstrapJoinedChild|^TestBootstrapOriginalAdapter|^TestXrayImageScope|^TestXrayDomainFile|^TestExternalBootstrapFileDiagnostic|^TestBootstrapOfflineStrategy|^TestBootstrapImage|^TestOrdinaryImage|^TestExternalBootstrapDiagnostic|^TestNativePairedRestoreOutput|^TestBackendClassicSave|^TestClassicSave|^TestFreshHeldNode|^TestFreshPathNode|^TestNetworkTiming|^TestNodeNetworkTimings|^TestOutputReader|^TestSyntheticBaselineCoordinatorRead|^TestMihomoSameBootAbsenceRead|^TestMihomoSameBootObservedTableRead|^TestExternalBootstrapSourceConfig|^TestNFQWSManagedCopy|^TestPinnedServiceNetworkTiming|^TestNFQWSQuarantine|^TestMihomoLiveStartContext|^TestMihomoManualPlanning|^TestDomainPreAdd|^TestDomainCaptureGuard|^TestNFQWS(NeverIssued|Recovery|Unpublished|ActivePurePredicates|ScopedExactPresenceObservation|ActivePreAdd|PreAddGenericAndProbe)|^Test(XraySelectedTCP|Proc)MountID|^TestWG(EndpointMissingTableJSONRequiresIndependentTextConfirmation|InactivityRequiresFreshCompleteAbsenceWithoutEffects)' -v

      - name: Repeat positive Cloudflare scan fixture boundaries
        shell: bash
        run: |
          set -euo pipefail
          for mode in normal race; do
            race_flag=()
            if [ "$mode" = race ]; then race_flag=(-race); fi
            sudo env PATH="$PATH" GOTOOLCHAIN=local \
              GOMODCACHE="$(go env GOMODCACHE)" GOCACHE="$(go env GOCACHE)" \
              go test "${race_flag[@]}" -count=10 ./internal/dataplane \
                -run '^TestCloudflareScanRunner(OwnsTemporaryInterfacePolicyAndCleanup|FailsClosedWhenCleanupIsUnconfirmed)$' -v
          done

      - name: Full project checks
        shell: bash
        run: |
          BASE_VERSION="$(tr -d '\r\n' < VERSION)"
          export RAZVILKA_VERSION="${BASE_VERSION}+${GITHUB_SHA::7}"
          export RAZVILKA_COMMIT="$GITHUB_SHA"
          export RAZVILKA_BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export RAZVILKA_DIRTY=false
          # Match the router UID for native process-ownership/recovery tests;
          # do not skip them or weaken the production root-only checks.
          sudo env PATH="$PATH" GOTOOLCHAIN="$GOTOOLCHAIN" \
            GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE" \
            GOMODCACHE="$(go env GOMODCACHE)" GOCACHE="$(go env GOCACHE)" \
            RAZVILKA_VERSION="$RAZVILKA_VERSION" RAZVILKA_COMMIT="$RAZVILKA_COMMIT" \
            RAZVILKA_BUILD_TIME="$RAZVILKA_BUILD_TIME" RAZVILKA_DIRTY="$RAZVILKA_DIRTY" \
            RAZVILKA_BUILD_TARGETS="$RAZVILKA_BUILD_TARGETS" ./scripts/check.sh
