name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
      # Intermediate router work uses AArch64; release/default checks keep all targets.
      RAZVILKA_BUILD_TARGETS: ${{ (github.ref == 'refs/heads/review/unified-lan-20260923' || github.head_ref == 'review/unified-lan-20260923') && 'arm64' || 'all' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          cache: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Full project checks
        shell: bash
        run: |
          BASE_VERSION="$(tr -d '\r\n' < VERSION)"
          export RAZVILKA_VERSION="${BASE_VERSION}+${GITHUB_SHA::7}"
          export RAZVILKA_COMMIT="$GITHUB_SHA"
          export RAZVILKA_BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export RAZVILKA_DIRTY=false
          ./scripts/check.sh
