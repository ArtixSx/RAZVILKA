name: Original component source read comparison
on:
  workflow_dispatch:
  push:
    branches: ['work/source-read-comparison-20261117']
permissions:
  contents: read
jobs:
  comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.5'
          cache: false
      - name: Obtain exact reviewed Mihomo bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          sh scripts/fetch-native-fixture.sh mihomo-1.19.33 /tmp/razvilka-source-mihomo.gz
          echo '132f6f3edf9a65e62f04853aed3358472e0b2b7666daa8419edfa2ddf5bb6323  /tmp/razvilka-source-mihomo.gz' | sha256sum --check --strict
          { git rev-parse HEAD; go version; uname -srvm; lscpu; } > artifacts/platform.txt
      - name: Original source current and complete runtime image comparisons
        shell: bash
        run: |
          set -euo pipefail
          for mode in normal race; do
            flags=()
            if [ "$mode" = race ]; then flags=(-race); fi
            RAZVILKA_MIHOMO_ARCHIVE=/tmp/razvilka-source-mihomo.gz RAZVILKA_RUNTIME_CLEAR_MEASURE=1 \
              go test "${flags[@]}" -tags razvilka_native_fixture -count=1 -v ./internal/components \
              -run '^TestMihomoLiveSourceNativeCurrent$|^TestManagedRuntime(Clear|PayloadClear)' \
              2>&1 | tee "artifacts/$mode.log"
            for name in TestMihomoLiveSourceNativeCurrent TestManagedRuntimePayloadClearOwnsEveryExit TestManagedRuntimeClearSourceParity TestManagedRuntimeClearFullImagePairs; do
              grep -F -- "--- PASS: $name " "artifacts/$mode.log"
            done
            if grep -F -- '--- SKIP:' "artifacts/$mode.log"; then exit 1; fi
            python3 - "$mode" <<'PY'
          import json,pathlib,sys
          mode=sys.argv[1]
          text=pathlib.Path('artifacts',mode+'.log').read_text()
          rows=[json.loads(line.split('nfq_runtime_clear_pair ',1)[1]) for line in text.splitlines() if 'nfq_runtime_clear_pair ' in line]
          assert len(rows)==8
          assert [r['variant'] for r in rows]==['duplicate-clear','single-clear','single-clear','duplicate-clear']*2
          for i,r in enumerate(rows):
              assert r['sample']==i and r['calls']==16 and r['payload_bytes']>0 and r['wall_ns']>0
          pathlib.Path('artifacts',mode+'-samples.json').write_text(json.dumps(rows,indent=2)+'\n')
          PY
          done
      - name: Preserve full checks and both populations
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: component-source-comparison-${{ github.sha }}
          path: artifacts/
