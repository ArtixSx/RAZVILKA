name: Feature source import

on:
  push:
    branches:
      - feature/engine-registry-nfqws2
    paths:
      - '.feature-import/READY'

permissions:
  contents: write

jobs:
  import-feature:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/engine-registry-nfqws2
          fetch-depth: 0

      - name: Reconstruct reviewed feature snapshot
        shell: bash
        run: |
          set -euo pipefail
          cat .feature-import/part-01 .feature-import/part-02 > /tmp/feature.b64
          base64 -d /tmp/feature.b64 > /tmp/feature.tar.gz
          echo '27f1ad76fb0a3a673afebbb6e5ca1a7ee7dfaa7eb158a5db3b38a0190bf0919a  /tmp/feature.tar.gz' | sha256sum -c -
          tar -tzf /tmp/feature.tar.gz >/dev/null
          tar -xzf /tmp/feature.tar.gz -C .
          rm -rf .feature-import

      - name: Commit feature changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'engine: add bounded registry and NFQWS2 discovery'
          git push origin HEAD:feature/engine-registry-nfqws2
