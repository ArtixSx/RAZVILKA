name: Mihomo actual LAN lifecycle
on:
  push:
    branches: ['work/mihomo-workflow-validation-20261102', 'work/bypass-integration-20261031']
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  live-native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        scenario: [lifecycle, postcas-failure, check-settlement]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.5'
          cache: false
      - name: Pinned official Xray and disposable namespace tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y iproute2 iptables nftables ipset conntrack kmod curl openssl util-linux unzip busybox-static python3 libnetfilter-queue1 libnfnetlink0 libluajit-5.1-2 zlib1g libmnl0
          curl --fail --location --retry 3 -o /tmp/xray.zip https://github.com/XTLS/Xray-core/releases/download/v26.10.31/Xray-linux-64.zip
          echo 'e4bd9119f50ae7c41658b1abd0679ae06f98bd864a2907ff33f2f2cf7081b214  /tmp/xray.zip' | sha256sum --check --strict
          unzip /tmp/xray.zip xray -d /tmp/xray-extracted
          sudo install -d -m 0755 /usr/local/lib/razvilka-fixtures
          sudo install -m 0555 /tmp/xray-extracted/xray /usr/local/lib/razvilka-fixtures/xray
          /usr/local/lib/razvilka-fixtures/xray version
          # The real local CA fixture uses the compiler's reviewed 26.3.27.
          # 26.10.31 defaults to a bundled CA pool instead of system roots.
          curl --fail --location --retry 3 -o /tmp/xray-node.zip https://github.com/XTLS/Xray-core/releases/download/v26.3.27/Xray-linux-64.zip
          echo '23cd9af937744d97776ee35ecad4972cf4b2109d1e0fe6be9930467608f7c8ae  /tmp/xray-node.zip' | sha256sum --check --strict
          unzip /tmp/xray-node.zip xray -d /tmp/xray-node-fixture
          sudo install -d -m 0755 /usr/local/lib/razvilka-fixtures/xray-node26.3.27
          sudo install -m 0555 /tmp/xray-node-fixture/xray /usr/local/lib/razvilka-fixtures/xray-node26.3.27/xray
          curl --fail --location --retry 3 -o /tmp/hev-socks5-tunnel https://github.com/heiher/hev-socks5-tunnel/releases/download/2.17.1/hev-socks5-tunnel-linux-x86_64
          echo 'a98763f18b0ad1f72a903221008488275f2bf60be00028886f9fa41622df6a03  /tmp/hev-socks5-tunnel' | sha256sum --check --strict
          sudo install -m 0555 /tmp/hev-socks5-tunnel /usr/local/lib/razvilka-fixtures/hev-socks5-tunnel
          curl --fail --location --retry 3 -o /tmp/mihomo.gz https://github.com/MetaCubeX/mihomo/releases/download/v1.19.33/mihomo-linux-amd64-v1.19.33.gz
          echo '132f6f3edf9a65e62f04853aed3358472e0b2b7666daa8419edfa2ddf5bb6323  /tmp/mihomo.gz' | sha256sum --check --strict
          sudo install -m 0400 /tmp/mihomo.gz /usr/local/lib/razvilka-fixtures/mihomo.gz
      - name: Actual registered Apply, native LAN TLS, Stop and retry
        if: matrix.scenario == 'lifecycle'
        shell: bash
        run: |
          set -euo pipefail
          sudo modprobe tun
          mkdir -p artifacts/mihomo-live-profile
          chmod 700 artifacts/mihomo-live-profile
          trap 'sudo chown -R "$(id -u):$(id -g)" artifacts/mihomo-live-profile' EXIT
          sudo env PATH="$PATH" GOTOOLCHAIN=local \
            GOMODCACHE="$(go env GOMODCACHE)" GOCACHE="$(go env GOCACHE)" \
            RAZVILKA_MIHOMO_LIVE_PROFILE_OUTPUT="$GITHUB_WORKSPACE/artifacts/mihomo-live-profile" \
            RAZVILKA_XRAY_NATIVE=/usr/local/lib/razvilka-fixtures/xray-node26.3.27/xray \
            RAZVILKA_MIHOMO_ARCHIVE=/usr/local/lib/razvilka-fixtures/mihomo.gz \
            RAZVILKA_HEV_NATIVE=/usr/local/lib/razvilka-fixtures/hev-socks5-tunnel \
            sh scripts/test-mihomo-live-native.sh
      - name: Retain bounded native CPU evidence
        if: always() && !cancelled() && matrix.scenario == 'lifecycle'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mihomo-live-cpu-${{ github.sha }}
          path: artifacts/mihomo-live-profile
          if-no-files-found: warn
      - name: Actual post-CAS required TLS rejection and exact desired undo
        if: always() && !cancelled() && matrix.scenario == 'postcas-failure'
        shell: bash
        run: |
          set -euo pipefail
          sudo env PATH="$PATH" GOTOOLCHAIN=local \
            GOMODCACHE="$(go env GOMODCACHE)" GOCACHE="$(go env GOCACHE)" \
            RAZVILKA_XRAY_NATIVE=/usr/local/lib/razvilka-fixtures/xray-node26.3.27/xray \
            RAZVILKA_MIHOMO_ARCHIVE=/usr/local/lib/razvilka-fixtures/mihomo.gz \
            RAZVILKA_HEV_NATIVE=/usr/local/lib/razvilka-fixtures/hev-socks5-tunnel \
            sh scripts/test-mihomo-live-postcas-native.sh
      - name: Original failed Check settlement, retained prerequisites and Stop retry
        if: always() && !cancelled() && matrix.scenario == 'check-settlement'
        shell: bash
        run: |
          set -euo pipefail
          sudo modprobe tun
          sudo env PATH="$PATH" GOTOOLCHAIN=local \
            GOMODCACHE="$(go env GOMODCACHE)" GOCACHE="$(go env GOCACHE)" \
            RAZVILKA_XRAY_NATIVE=/usr/local/lib/razvilka-fixtures/xray-node26.3.27/xray \
            RAZVILKA_MIHOMO_ARCHIVE=/usr/local/lib/razvilka-fixtures/mihomo.gz \
            RAZVILKA_HEV_NATIVE=/usr/local/lib/razvilka-fixtures/hev-socks5-tunnel \
            sh scripts/test-mihomo-live-check-settlement-native.sh
      - name: Original read observation bookends with official child, normal and race
        if: always() && !cancelled() && matrix.scenario == 'lifecycle'
        shell: bash
        run: |
          set -euo pipefail
          work=$(mktemp -d /tmp/razvilka-mihomo-observation.XXXXXX)
          chmod 700 "$work"
          trap 'sudo rm -rf "$work"' EXIT
          for package in components dataplane restorejournal; do
            go test -c -o "$work/$package-normal.test" "./internal/$package"
            go test -race -c -o "$work/$package-race.test" "./internal/$package"
          done
          chmod 555 "$work/"*.test
          failed=0
          for package in components dataplane restorejournal; do
            case "$package" in
              components) pattern='^TestMihomoLiveOriginal(ReadFingerprintNativeMutation|ChildSurvivesApplyAndNeedsFreshCleanup)$|^TestMihomoLiveReadFingerprintIncludesActualIdentityAndCTime$' ;;
              dataplane) pattern='^TestMihomoLiveOfficialOriginalKernelOwnerAcrossApplyRelease$|^TestNodeTransitSharedOwner|^TestNodeTransitPolicyRuntime|^TestMihomoHealthHandoff|^TestMihomoActiveChecking|^TestMihomoRetainedCheck|^TestMihomoTransitArchive' ;;
              restorejournal) pattern='^TestArtifactComparison|^TestArtifactExpectedReadComparison' ;;
            esac
            for mode in normal race; do
              echo "actual_original_observation_package=$package mode=$mode fixture_budget_components=30s fixture_budget_dataplane=45s"
              timeout 90s sudo env \
                RAZVILKA_MIHOMO_ARCHIVE=/usr/local/lib/razvilka-fixtures/mihomo.gz \
                RAZVILKA_ARTIFACT_EXPECTED_TIMING=1 \
                unshare --mount --net --fork --kill-child=KILL sh -eu -c '
                  mount --make-rprivate /
                  ip link set lo up
                  exec "$1" -test.run "$2" -test.v -test.timeout 75s
                ' sh "$work/$package-$mode.test" "$pattern" || failed=1
            done
          done
          exit "$failed"
