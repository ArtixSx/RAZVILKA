name: Original DNS detachment ownership validation
on:
  push:
    branches: ['work/domain-detachment-validation-20261102', 'work/bypass-integration-20261031']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: domain-detachment-${{ github.ref }}
  cancel-in-progress: true
env:
  GOTOOLCHAIN: local
jobs:
  published-dns-standby:
    name: DNS-only publication and cached-alias baseline (no selected service claim)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.5'
          cache: false
      - name: Same pinned official binary and namespace tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y iproute2 iptables util-linux unzip busybox-static python3
          curl --fail --location --retry 3 -o /tmp/xray-node.zip https://github.com/XTLS/Xray-core/releases/download/v26.3.27/Xray-linux-64.zip
          echo '23cd9af937744d97776ee35ecad4972cf4b2109d1e0fe6be9930467608f7c8ae  /tmp/xray-node.zip' | sha256sum --check --strict
          unzip /tmp/xray-node.zip xray -d /tmp/xray-node-fixture
          sudo install -d -m 0755 /usr/local/lib/razvilka-fixtures
          sudo install -m 0555 /tmp/xray-node-fixture/xray /usr/local/lib/razvilka-fixtures/xray
      - name: Original writer and typed reader regressions
        run: RAZVILKA_XRAY_NATIVE=/usr/local/lib/razvilka-fixtures/xray go test -race -count=1 ./internal/startuptools ./internal/netidentity ./internal/physicalscope ./internal/dnscontrol ./internal/dataplane -run 'TestHashImage|TestBoundedRead|TestDumpScratch|TestVersionExtensionPath|TestDomainBaselineScopedRead|TestDomainBaselineObservedRead|TestSyntheticDNSContinuation|TestSyntheticDNSRetiredContinuation|TestDomainDNSDetached|TestDomainStandbyConcurrent|TestOriginalRecordClose|TestDomainGlobalHistoricalFD|TestDomainGlobalSuccessor|TestDomainPool|TestDomainAction|TestDomainFailedClose|TestDomainKeeper|TestDomainRetiredKeeper|TestDomainInitialRetirement|TestDomainCoexistence|TestDomainDNSCoexistence|TestMihomoTransitArchive|TestXrayDomainTCPNativeHeldProcessLifecycle'
      - name: Actual DNS send, original Stop and cached-alias TLS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p -m 700 artifacts/dns-only-standby
          trap 'sudo chown -R "$(id -u):$(id -g)" artifacts/dns-only-standby' EXIT
          sudo env PATH="$PATH" GOTOOLCHAIN=local \
            GOMODCACHE="$(go env GOMODCACHE)" GOCACHE="$(go env GOCACHE)" \
            RAZVILKA_XRAY_NATIVE=/usr/local/lib/razvilka-fixtures/xray \
            RAZVILKA_DOMAIN_DNS_ONLY_NATIVE=1 RAZVILKA_DOMAIN_DIAGNOSTIC_PUBLICATION=30 \
            RAZVILKA_DOMAIN_PROFILE_OUTPUT="$GITHUB_WORKSPACE/artifacts/dns-only-standby" \
            sh scripts/test-domain-original-native.sh 2>&1 | tee artifacts/dns-only-standby/native.log
      - name: Preserve actual diagnostic clocks and CPU samples
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dns-only-standby-${{ github.sha }}
          path: artifacts/dns-only-standby
          if-no-files-found: warn
  detached-dns-ownership:
    name: DNS-only original detachment / ${{ matrix.cut }}
    needs: published-dns-standby
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        cut: [clean, alias0, alias1, global, registry, foreign-history]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.5'
          cache: false
      - name: Same pinned official binary and namespace tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y iproute2 iptables util-linux unzip busybox-static python3
          curl --fail --location --retry 3 -o /tmp/xray-node.zip https://github.com/XTLS/Xray-core/releases/download/v26.3.27/Xray-linux-64.zip
          echo '23cd9af937744d97776ee35ecad4972cf4b2109d1e0fe6be9930467608f7c8ae  /tmp/xray-node.zip' | sha256sum --check --strict
          unzip /tmp/xray-node.zip xray -d /tmp/xray-node-fixture
          sudo install -d -m 0755 /usr/local/lib/razvilka-fixtures
          sudo install -m 0555 /tmp/xray-node-fixture/xray /usr/local/lib/razvilka-fixtures/xray
      - name: Original DNS handoff and same-owner retry
        shell: bash
        env:
          CUT: ${{ matrix.cut }}
        run: |
          set -euo pipefail
          ack=''
          foreign=''
          case "$CUT" in
            clean) ;;
            alias0|alias1|global|registry) ack="$CUT" ;;
            foreign-history) foreign=1 ;;
            *) exit 2 ;;
          esac
          mkdir -p -m 700 artifacts/dns-detachment
          trap 'sudo chown -R "$(id -u):$(id -g)" artifacts/dns-detachment' EXIT
          sudo env PATH="$PATH" GOTOOLCHAIN=local \
            GOMODCACHE="$(go env GOMODCACHE)" GOCACHE="$(go env GOCACHE)" \
            RAZVILKA_XRAY_NATIVE=/usr/local/lib/razvilka-fixtures/xray \
            RAZVILKA_DOMAIN_DNS_ONLY_NATIVE=1 RAZVILKA_DOMAIN_DIAGNOSTIC_PUBLICATION=30 \
            RAZVILKA_DOMAIN_DNS_DETACH=1 RAZVILKA_DOMAIN_DNS_DETACH_ACK="$ack" \
            RAZVILKA_DOMAIN_DNS_DETACH_FOREIGN_HISTORY="$foreign" \
            RAZVILKA_DOMAIN_PROFILE_OUTPUT="$GITHUB_WORKSPACE/artifacts/dns-detachment" \
            sh scripts/test-domain-original-native.sh 2>&1 | tee artifacts/dns-detachment/native.log
      - name: Preserve original custody observations
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dns-detachment-${{ matrix.cut }}-${{ github.sha }}
          path: artifacts/dns-detachment
          if-no-files-found: warn
  original-domain-coexistence:
    name: Original DNS generations / initial ACK ${{ matrix.initial }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        initial: [none, transaction, global, never-issued, joined-failure, canceled-child]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.5'
          cache: false
      - name: Same pinned official binary and disposable namespace tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y iproute2 iptables util-linux unzip busybox-static python3
          curl --fail --location --retry 3 -o /tmp/xray-node.zip https://github.com/XTLS/Xray-core/releases/download/v26.3.27/Xray-linux-64.zip
          echo '23cd9af937744d97776ee35ecad4972cf4b2109d1e0fe6be9930467608f7c8ae  /tmp/xray-node.zip' | sha256sum --check --strict
          unzip /tmp/xray-node.zip xray -d /tmp/xray-node-fixture
          sudo install -d -m 0755 /usr/local/lib/razvilka-fixtures
          sudo install -m 0555 /tmp/xray-node-fixture/xray /usr/local/lib/razvilka-fixtures/xray
      - name: Original closed predecessor, successor writer, new flow and old late SYN
        shell: bash
        env:
          INITIAL_CUT: ${{ matrix.initial }}
        run: |
          set -euo pipefail
          never_issued=0
          joined_failure=0
          canceled_child=0
          case "$INITIAL_CUT" in
            none) initial_ack='' ;;
            transaction|global) initial_ack="$INITIAL_CUT" ;;
            never-issued) initial_ack=''; never_issued=1 ;;
            joined-failure) initial_ack=''; never_issued=1; joined_failure=1 ;;
            canceled-child) initial_ack=''; canceled_child=1 ;;
            *) exit 2 ;;
          esac
          mkdir -p -m 700 artifacts/dns-coexistence
          trap 'sudo chown -R "$(id -u):$(id -g)" artifacts/dns-coexistence' EXIT
          sudo env PATH="$PATH" GOTOOLCHAIN=local \
            GOMODCACHE="$(go env GOMODCACHE)" GOCACHE="$(go env GOCACHE)" \
            RAZVILKA_XRAY_NATIVE=/usr/local/lib/razvilka-fixtures/xray \
            RAZVILKA_DOMAIN_DNS_ONLY_NATIVE=1 RAZVILKA_DOMAIN_DIAGNOSTIC_PUBLICATION=30 \
            RAZVILKA_DOMAIN_DNS_DETACH=1 RAZVILKA_DOMAIN_DNS_COEXISTENCE=1 \
            RAZVILKA_DOMAIN_INITIAL_ACK="$initial_ack" \
            RAZVILKA_DOMAIN_NEVER_ISSUED_SUCCESSOR="$never_issued" \
            RAZVILKA_DOMAIN_JOINED_FAILURE="$joined_failure" \
            RAZVILKA_DOMAIN_CANCELED_CHILD="$canceled_child" \
            RAZVILKA_DOMAIN_PROFILE_OUTPUT="$GITHUB_WORKSPACE/artifacts/dns-coexistence" \
            sh scripts/test-domain-original-native.sh 2>&1 | tee artifacts/dns-coexistence/native.log
      - name: Preserve actual two-operation diagnostics, including failures
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dns-coexistence-${{ matrix.initial }}-${{ github.sha }}
          path: artifacts/dns-coexistence
          if-no-files-found: warn
