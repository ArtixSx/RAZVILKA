name: DNS router-source direct validation
on:
  workflow_dispatch:
  push:
    branches: ['work/domain-router-direct-20261117']
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        scenario: [selected, direct-deny, canceled-ready]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.5'
          cache: false
      - name: Same pinned official binary and namespace tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y iproute2 iptables util-linux unzip busybox-static python3
          sh scripts/fetch-native-fixture.sh xray-26.3.27 /tmp/xray-node.zip
          echo '23cd9af937744d97776ee35ecad4972cf4b2109d1e0fe6be9930467608f7c8ae  /tmp/xray-node.zip' | sha256sum --check --strict
          unzip /tmp/xray-node.zip xray -d /tmp/xray-node-fixture
          sudo install -d -m 0755 /usr/local/lib/razvilka-fixtures
          sudo install -m 0555 /tmp/xray-node-fixture/xray /usr/local/lib/razvilka-fixtures/xray
      - name: Direct authority, cancellation and fixed read ABI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/domain
          for mode in normal race; do
            flags=()
            if [ "$mode" = race ]; then flags=(-race); fi
            go test "${flags[@]}" -tags razvilka_native_fixture -count=1 -v ./internal/dataplane ./internal/startuptools \
              -run '^TestDomainTCPDirect|^TestDomainBaselineObservedRead|^TestDomainNativeAcceptedStages|^TestDomainAcceptedPrefix|^TestDomainMappingObservation|^TestXrayDomainFileObservation|^TestDomainPolicySyntheticTCP(Model|Scope|Capture)' \
              2>&1 | tee "artifacts/domain/direct-contract-$mode.log"
            grep -F -- '--- PASS: TestDomainTCPDirect' "artifacts/domain/direct-contract-$mode.log"
            grep -F -- '--- PASS: TestDomainBaselineObservedRead' "artifacts/domain/direct-contract-$mode.log"
            grep -F -- '--- PASS: TestDomainAcceptedPrefix' "artifacts/domain/direct-contract-$mode.log"
            if grep -E '^[[:space:]]*--- SKIP:' "artifacts/domain/direct-contract-$mode.log"; then exit 1; fi
          done
      - name: Original scope and cleanup with unchanged production deadlines
        shell: bash
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: |
          set -euo pipefail
          mkdir -p -m 700 artifacts/domain
          trap 'sudo chown -R "$(id -u):$(id -g)" artifacts/domain' EXIT
          case "$SCENARIO" in
            selected) expected_case=TestDomainTCPOriginalNativeAcceptedFlows ;;
            direct-deny)
              expected_case=TestDomainTCPOriginalNativeDirectForwardDeny
              export RAZVILKA_DOMAIN_DIRECT_DENY_NATIVE=1 ;;
            canceled-ready)
              expected_case=TestDomainTCPOriginalNativeCanceledReadyRetirement
              export RAZVILKA_DOMAIN_DNS_ONLY_NATIVE=1
              export RAZVILKA_DOMAIN_DNS_DETACH=1 RAZVILKA_DOMAIN_DNS_COEXISTENCE=1
              export RAZVILKA_DOMAIN_CANCELED_CHILD=1 RAZVILKA_DOMAIN_CANCELED_READY=1 ;;
            *) exit 2 ;;
          esac
          sudo --preserve-env=RAZVILKA_DOMAIN_DIRECT_DENY_NATIVE,RAZVILKA_DOMAIN_DNS_ONLY_NATIVE,RAZVILKA_DOMAIN_DNS_DETACH,RAZVILKA_DOMAIN_DNS_COEXISTENCE,RAZVILKA_DOMAIN_CANCELED_CHILD,RAZVILKA_DOMAIN_CANCELED_READY \
            env PATH="$PATH" GOTOOLCHAIN=local \
            GOMODCACHE="$(go env GOMODCACHE)" GOCACHE="$(go env GOCACHE)" \
            RAZVILKA_XRAY_NATIVE=/usr/local/lib/razvilka-fixtures/xray \
            RAZVILKA_DOMAIN_PROFILE_OUTPUT="$GITHUB_WORKSPACE/artifacts/domain" \
            sh scripts/test-domain-original-native.sh 2>&1 | tee artifacts/domain/native.log
          grep -F -- "--- PASS: $expected_case " artifacts/domain/native.log
          if [ "$SCENARIO" = direct-deny ]; then grep -F 'ACTUAL_DIRECT_FORWARD_DENY_ZERO_SYN:' artifacts/domain/native.log; fi
          if grep -F -- '--- SKIP:' artifacts/domain/native.log; then exit 1; fi
          grep -Fx 'child_exit_status=0' artifacts/domain/status.txt
          grep -Fx "native_case=$expected_case" artifacts/domain/status.txt
          grep -Fx 'publication_budget_seconds=12' artifacts/domain/status.txt
          grep -Fx 'diagnostic_only=false' artifacts/domain/status.txt
      - name: Preserve original result including failures
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: domain-router-direct-${{ matrix.scenario }}-${{ github.sha }}
          path: artifacts/domain
          if-no-files-found: error
          retention-days: 14
