        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hev-after-failure-${{ github.job }}-${{ matrix.mode }}-${{ matrix.ack_cut || 'parent' }}-${{ github.sha }}
          path: artifacts/hev-after-failure
          if-no-files-found: warn
      - name: Preserve original consumer diagnostic
        if: ${{ !cancelled() && inputs.consumer_profile }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sameboot-profile-${{ matrix.mode }}-${{ matrix.ack_cut }}-${{ github.sha }}
          path: artifacts/sameboot-profile
          if-no-files-found: error
