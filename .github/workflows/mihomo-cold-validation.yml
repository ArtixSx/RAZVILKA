name: Mihomo offline cold recovery validation
on:
  push:
    branches: ['work/mihomo-cold-validation-20261102', 'work/bypass-integration-20261031']
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  original-native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [normal, race]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.5'
          cache: false
      - name: Official pinned image
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/mihomo.gz https://github.com/MetaCubeX/mihomo/releases/download/v1.19.33/mihomo-linux-amd64-v1.19.33.gz
          echo '132f6f3edf9a65e62f04853aed3358472e0b2b7666daa8419edfa2ddf5bb6323  /tmp/mihomo.gz' | sha256sum --check --strict
          sudo install -d -m 0755 /usr/local/lib/razvilka-fixtures
          sudo install -m 0400 /tmp/mihomo.gz /usr/local/lib/razvilka-fixtures/mihomo.gz
      - name: Actual original children, cleanup, cold pidfd and COMMON publication models
        shell: bash
        env:
          BUILD_MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          flags=()
          if [[ "$BUILD_MODE" == race ]]; then flags+=(-race); fi
          sudo env PATH="$PATH" GOTOOLCHAIN=local \
            GOMODCACHE="$(go env GOMODCACHE)" GOCACHE="$(go env GOCACHE)" \
            RAZVILKA_MIHOMO_ARCHIVE=/usr/local/lib/razvilka-fixtures/mihomo.gz \
            go test "${flags[@]}" ./internal/dataplane ./internal/components ./internal/operationgate ./internal/updatecheck ./cmd/razvilka \
              -run 'TestDomainDNSDetached|TestExecutionHistory|TestMihomoLive|TestOriginalRecord|TestDomainStandbyConcurrent|TestDomainTCPStandby|TestControlEpoch.*Cleanup' -count=1 -v -timeout=10m
      - name: Original cold read source dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y iptables nftables iproute2 util-linux iputils-ping wireguard-tools python3 curl ca-certificates libnetfilter-queue1 libnfnetlink0 libluajit-5.1-2 zlib1g libmnl0
      - name: Actual held source, bounded read ABI and revocation
        env:
          BUILD_MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          mode=production
          if [[ "$BUILD_MODE" == race ]]; then mode=race; fi
          sudo env PATH="$PATH" GOTOOLCHAIN=local \
            GOMODCACHE="$(go env GOMODCACHE)" GOCACHE="$(go env GOCACHE)" \
            RAZVILKA_MIHOMO_COLD_SOURCE_NATIVE=1 RAZVILKA_MANAGED_PROBE_BUILD_MODE="$mode" \
            sh scripts/test-managed-probe-native.sh
