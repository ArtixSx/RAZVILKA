name: Bootstrap source import

on:
  push:
    branches: [dev]
    paths:
      - '.bootstrap/READY'

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Reconstruct reviewed source snapshot
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .bootstrap/part-01 \
            .bootstrap/part-02a \
            .bootstrap/part-02b \
            .bootstrap/part-03a \
            .bootstrap/part-03b \
            .bootstrap/part-04 \
            .bootstrap/part-05 \
            .bootstrap/part-06 \
            > /tmp/razvilka-source.b64
          base64 -d /tmp/razvilka-source.b64 > /tmp/razvilka-source.tar.gz
          echo '48835edd90be02ece19608b6584cfdd675602a00a3895695b5339a0dc5887044  /tmp/razvilka-source.tar.gz' | sha256sum -c -
          tar -tzf /tmp/razvilka-source.tar.gz >/dev/null
          tar -xzf /tmp/razvilka-source.tar.gz -C .
          rm -rf .bootstrap
          rm -f CODEX_TEST.md MIGRATION_NOTE.md
          rm -f .github/workflows/bootstrap-source.yml

      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: import RAZVILKA v0.0.7 control lab'
          git push origin HEAD:dev
